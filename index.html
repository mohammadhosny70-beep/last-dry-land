html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--table);color:var(--cream);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud" "board" "panel"}
#hud{grid-area:hud}
#boardWrap{grid-area:board}
#panel{grid-area:panel}
@media (min-width:760px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"board hud" "board panel"}
  #hud{box-shadow:inset 3px 0 0 var(--woodDark)}
  #panel{box-shadow:inset 3px 0 0 var(--woodDark);height:auto!important;align-content:start!important}
  #actions{grid-template-columns:1fr!important}
  #info{height:auto!important;min-height:40px}
  #panel{grid-template-rows:auto auto minmax(0,1fr) auto;align-content:stretch!important}
  .bottom{margin-top:8px;align-self:end}
  #sideNote{display:block!important;align-self:start;overflow:auto;min-height:0;margin-top:6px;padding:12px 14px;background:radial-gradient(ellipse at 50% 40%,#f6ead0,var(--paper) 60%,var(--paperEdge));color:var(--inkC);font-family:var(--hand);font-size:21px;line-height:1.15;transform:rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.35)}
}
#sideNote{display:none}
#sideNote h3{margin:0 0 2px;font-family:var(--hand);font-weight:700;font-size:26px;color:var(--inkC)}
#sideNote p{margin:0 0 6px;color:#5e3f1f}
#sideNote ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
#sideNote li{display:flex;gap:7px;align-items:center}
#sideNote li.met span::after{content:" ✓";color:#2f6b3a}
.wood{background:var(--wood);background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 10px,transparent 10px 23px)}
#hud{padding:8px max(12px,env(safe-area-inset-right,0px)) 9px max(12px,env(safe-area-inset-left,0px));box-shadow:inset 0 -3px 0 var(--woodDark);display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#turn{font-family:var(--sign);font-weight:400;font-size:20px;white-space:nowrap}
#tide{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:12px;border-radius:2px 2px 5px 5px;background:var(--woodDark);display:block}
.pips i.on{background:var(--sea);box-shadow:inset 0 -2px 0 #336d93}
.res{font-size:16px;font-weight:700}
.res span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.res svg{flex:none}
.res small{font-weight:500;font-size:13px;opacity:.75}
.score .me{color:var(--me)} .score .foe{color:#ff8a8f}
#boardWrap{position:relative;overflow:hidden;background:var(--table)}
#board{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#board.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;padding:0;border-radius:8px;font-family:var(--font);font-weight:800;font-size:22px;line-height:1;background:rgba(243,230,200,.92);color:var(--wood)}

/* messages: a navy ribbon with notched ends and gold rules, an icon on the left */
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-12px);display:flex;align-items:center;gap:10px;
  background:linear-gradient(var(--gold),var(--gold)) 0 5px/100% 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 calc(100% - 5px)/100% 1px no-repeat,linear-gradient(#2a4c5a,var(--navy));
  color:var(--cream);padding:12px 32px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);
  font-family:var(--sign);font-weight:400;font-size:17px;line-height:1.15;max-width:min(88%,460px);width:max-content;box-sizing:border-box;pointer-events:none;opacity:0;transition:opacity .2s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{flex:none}
#toast.bad{background:linear-gradient(var(--gold),var(--gold)) 0 5px/100% 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 calc(100% - 5px)/100% 1px no-repeat,linear-gradient(#8f3426,#5f1d14)}

#panel{padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:inset 0 3px 0 var(--woodDark);display:grid;gap:8px;height:calc(186px + env(safe-area-inset-bottom,0px));box-sizing:border-box;align-content:space-between}
#info{height:30px;overflow:hidden;display:grid;align-content:center;gap:4px}
#info .hint{font-size:14px;font-weight:600;opacity:.75}
#info .who{display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
#info .name{font-family:var(--sign);font-weight:400;font-size:20px;line-height:1}
#info .chip{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:15px}
#info .sub{font-size:14px;line-height:1.25;opacity:.88}
#actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:50px}
button{font:inherit;border:0;border-radius:8px;padding:6px 8px;background:var(--cream);color:var(--ink);font-weight:700;font-size:15px;box-shadow:inset 0 -3px 0 #c4ab7c;cursor:pointer}
#actions button{height:62px;font-size:16px;display:grid;align-content:center;justify-items:center;text-align:center;line-height:1.1;overflow:hidden;white-space:nowrap}
#actions button span svg{vertical-align:-1px;margin:0 3px 0 1px}
#actions button span{display:block;font-weight:500;font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#actions button .why{color:#8a2a1a;opacity:1;font-weight:700}
button:disabled{opacity:.72;cursor:default}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.bottom{display:flex;align-items:center;gap:8px}
.icons{display:flex;gap:6px}
button.icon{width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;font-family:var(--sign);font-weight:400;font-size:22px;background:var(--cream);color:var(--wood)}
#status{flex:1;min-width:0;font-size:13px;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#endTurn{background:var(--seal);color:var(--cream);box-shadow:inset 0 -3px 0 var(--sealDark);padding:10px 18px;font-family:var(--sign);font-weight:400;font-size:17px;white-space:nowrap}

/* cards: a page from the old sea chart - parchment, inner ink rule, wax-seal button */
#overlay{position:fixed;inset:0;background:rgba(8,16,20,.74);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:radial-gradient(ellipse at 50% 40%,#f6ead0 0%,var(--paper) 55%,var(--paperEdge) 100%);color:var(--ink);border:1px solid #9c7d4a;outline:1px solid rgba(80,55,25,.55);outline-offset:-9px;
  padding:26px 26px 22px;max-width:400px;width:100%;box-sizing:border-box;max-height:86vh;overflow:auto;display:grid;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);border-radius:2px}
.card h2{margin:0;font-family:var(--sign);font-weight:400;font-size:30px;line-height:1.05;text-align:center;color:#3b2812}
.card .rule{height:9px;position:relative;background:linear-gradient(#7a5a30,#7a5a30) 0 4px/calc(50% - 10px) 1px no-repeat,linear-gradient(#7a5a30,#7a5a30) 100% 4px/calc(50% - 10px) 1px no-repeat}
.card .rule::after{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;margin-left:-4px;background:#7a5a30;transform:rotate(45deg)}
.card p{margin:0;font-size:16px;line-height:1.4}
.card p.small{font-size:14px;opacity:.75;text-align:center}
.card .step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.35}
.card .step .n{font-family:var(--sign);font-weight:400;font-size:24px;line-height:1;color:var(--seal);text-align:center}
.card b{color:#5b3a16}
.card button{justify-self:center;background:radial-gradient(circle at 40% 35%,#a8402f,var(--seal) 60%,var(--sealDark));color:var(--cream);box-shadow:0 3px 0 var(--sealDark),0 6px 12px rgba(0,0,0,.25);padding:10px 30px;border-radius:22px;font-family:var(--sign);font-weight:400;font-size:20px}
.card .rulepic{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.card .rulepic h3{margin:0 0 2px;font-family:var(--sign);font-weight:400;font-size:19px;color:#3b2812}
.card .rulepic p{font-size:15px;line-height:1.3}
.card button.link{background:linear-gradient(#efe0bd,#e1cb9b);color:var(--ink);box-shadow:0 3px 0 #b39563,inset 0 0 0 1px rgba(90,60,25,.25);padding:9px 20px;font-size:17px}
/* the sea chart between matches */
#chart{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:#c9ad78}
#chartMap{min-height:0;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px 0}
.chartSvg{width:100%;height:100%;max-width:640px}
.chartSvg .isle.go{cursor:pointer}
.chartSvg .pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
/* journey finale (MO 11-03): the house on the peak goes up when the route has been drawn; the bar keeps only the lines */
.chartSvg .late{opacity:0;animation:houseIn .9s ease-out 7s forwards}
@keyframes houseIn{from{opacity:0;transform:translateY(1.5px)}to{opacity:1;transform:none}}
.chartSvg .fire{animation:fire 1.1s ease-in-out infinite}
@keyframes fire{50%{opacity:.45}}
#chartBar.finale button{display:none}
#chartBar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:inset 0 3px 0 var(--woodDark)}
#chartNote{flex:1;min-width:0;font-size:15px;line-height:1.3}
#resumeBtn{background:var(--seal);color:var(--cream);box-shadow:inset 0 -3px 0 var(--sealDark);padding:10px 16px;font-family:var(--sign);font-weight:400;font-size:17px;white-space:nowrap}
button.icon:disabled{opacity:.35}
/* cards: buttons, stars, goals, difficulty */
.cardBtns{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center}
.card .stars{display:flex;justify-content:center;gap:4px}
/* goals: strips with a star, gold when met */
.card ul.goals{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:15px;font-weight:600}
.card ul.goals li{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;background:rgba(90,60,25,.09);box-shadow:inset 0 0 0 1px rgba(90,60,25,.14)}
.card ul.goals li svg{flex:none}
.card ul.goals li.met{background:rgba(224,169,42,.2);box-shadow:inset 0 0 0 1px rgba(170,120,20,.35)}
.card p.story{font-size:15px;text-align:center;color:#6b4a2b;padding:8px 6px 0;border-top:1px dashed rgba(90,60,25,.35)}
/* result card: ribbon banner, big stars, land tally */
.banner{justify-self:center;margin:-8px 0 2px;position:relative;padding:8px 34px 10px;color:var(--cream);font-family:var(--sign);font-size:30px;line-height:1;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(#a8402f,var(--seal));clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);filter:drop-shadow(0 3px 0 var(--sealDark))}
.banner.lose{background:linear-gradient(#55626a,#38434a)}
.banner.sea{background:linear-gradient(#2f5f78,#1f4357);font-size:24px;filter:drop-shadow(0 3px 0 #13303f)}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.facts span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;background:rgba(90,60,25,.1);font-size:13px;font-weight:700;color:#4a3015}
.card .stars svg{transform:scale(.4);opacity:0;animation:starIn .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(.25s + var(--k) * .28s)}
@keyframes starIn{to{transform:none;opacity:1}}
.tally{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.tally .side{display:grid;gap:1px;padding:6px;border-radius:8px}
.tally b{font-family:var(--sign);font-weight:400;font-size:34px;line-height:1}
.tally .you b{color:#c98a0c}.tally .them b{color:var(--seal)}
.tally span{font-size:13px;font-weight:700;opacity:.75}
.tally .vs{font-family:var(--sign);font-size:16px;opacity:.5}
/* difficulty: one wooden switch with three positions */
.card .difs{justify-self:center;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:#5a3d22;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.card button.dif{background:transparent;color:#f3e6c8;box-shadow:none;font-family:var(--sign);font-weight:400;font-size:17px;padding:7px 18px;border-radius:9px;opacity:.75}
.card button.dif.on{background:linear-gradient(#f3e3bd,#e0c896);color:var(--ink);box-shadow:0 2px 0 #9c7d4a;opacity:1}
/* ---- Grandmother's hand: cards, notes and the chart are written by her, not printed ---- */
:root{--hand:"Patrick Hand","Segoe Print",cursive;--inkC:#3a2414}
.card{font-family:var(--hand);color:var(--inkC);outline:none;border-color:rgba(120,90,50,.5);transform:rotate(-.5deg);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 40px rgba(140,100,50,.18)}
.card h2{font-family:var(--hand);font-weight:700;font-size:38px;line-height:1;color:var(--inkC)}
.card p,.card p.small,.card p.story{font-family:var(--hand);font-size:22px;line-height:1.15;opacity:1;border:0;padding:0;color:var(--inkC)}
.card p.small{font-size:20px;color:#5e3f1f}
.card b{color:var(--inkC)}
.card .rule{display:none}
.banner,.banner.sea,.banner.lose{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2012%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M3%207c30-5%2060%202%2095-1s70-4%2099%201%22%20fill%3D%22none%22%20stroke%3D%22%236b3a1e%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center bottom/90% 10px no-repeat;clip-path:none;filter:none;text-shadow:none;margin:0;padding:0 10px 10px;
  font-family:var(--hand);font-weight:700;font-size:26px;color:#8f2f22;letter-spacing:0}
.banner.lose{color:#4a4f55}
.facts{gap:0 14px}
.facts span{background:none;padding:0;border-radius:0;font-family:var(--hand);font-size:20px;font-weight:500;color:#5e3f1f}
.facts span svg{opacity:.8}
.card ul.goals{gap:2px;font-family:var(--hand);font-size:22px;font-weight:500}
.card ul.goals li,.card ul.goals li.met{background:none;box-shadow:none;padding:1px 2px;border-radius:0}
.card ul.goals li.met span::after{content:" ✓";color:#2f6b3a}
.tally b{font-family:var(--hand);font-weight:700;font-size:44px}
.tally span,.tally .vs{font-family:var(--hand);font-size:19px;font-weight:500;opacity:.85}
.card .difs{background:none;box-shadow:none;padding:0;gap:6px}
.card button.dif,.card button.dif.on{background:none;box-shadow:none;color:var(--inkC);font-family:var(--hand);font-weight:700;font-size:24px;padding:4px 16px;opacity:.6}
.card button.dif.on{opacity:1;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%2040%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M12%2022C10%208%2050%203%2080%207s16%2022-8%2028-62%202-62-14%206-17%2030-18%22%20fill%3D%22none%22%20stroke%3D%22%238f2f22%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center/100% 100% no-repeat}
.card button{font-family:var(--hand);font-weight:700;font-size:26px;padding:8px 28px}
.card button.link{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2012%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M3%207c30-5%2060%202%2095-1s70-4%2099%201%22%20fill%3D%22none%22%20stroke%3D%22%236b3a1e%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center bottom/85% 8px no-repeat;box-shadow:none;color:var(--inkC);padding:2px 8px 8px;font-size:24px;border-radius:0}
.card .rulepic h3{font-family:var(--hand);font-weight:700;font-size:25px;color:var(--inkC)}
.card .rulepic p{font-size:20px;line-height:1.1}
#chartNote{font-family:var(--hand);font-size:23px;line-height:1.1}
#resumeBtn{font-family:var(--hand);font-weight:700;font-size:22px}
#modesBtn,#rulesBtn{background:linear-gradient(#efe0bd,#e1cb9b);color:var(--inkC);box-shadow:0 3px 0 #b39563;font-family:var(--hand);font-weight:700;font-size:22px;padding:8px 14px;white-space:nowrap}
.card .modeRow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.card .modeRow h3{margin:0;font-family:var(--hand);font-weight:700;font-size:27px;color:var(--inkC)}
.card .modeRow p{grid-column:1;font-size:20px;color:#5e3f1f}
.card .modeRow button{grid-row:1 / span 2;grid-column:2;font-size:22px;padding:6px 20px}
.card .islePick{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.card .islePick button{font-size:23px}
@media (prefers-reduced-motion: reduce){.chartSvg .pulse,.chartSvg .fire{animation:none}.chartSvg .late{animation:none;opacity:1}.card .stars svg{animation:none;transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
#peakTxt{font-weight:700;white-space:nowrap}
#peakTxt.foe{color:#ff8a8f}
#peakTxt.me{color:var(--me)}
/* storms: a lightning flash over the board and a short shake when one hits (no shake with reduced motion) */
#flash{position:absolute;inset:0;pointer-events:none;background:#eef3ff;opacity:0}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}5%{opacity:.8}12%{opacity:.1}20%{opacity:.6}100%{opacity:0}}
#board.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,2px)}60%{transform:translate(3px,-2px)}80%{transform:translate(-1px,1px)}}
@media (prefers-reduced-motion: reduce){#flash.on{animation:flashSoft .9s ease-out}#board.shake{animation:none}}
@keyframes flashSoft{0%{opacity:0}10%{opacity:.3}100%{opacity:0}}
/* ---- the game's hand (MO picked H): pencil-sketched headings in Cabin Sketch, everything else in
   Patrick Hand. Each face comes in one weight, so no fake bold; sizes are a little larger than the
   old print faces because both run small ---- */
html{font-synthesis:none}
#turn{font-size:21px}
#info .name{font-size:19px}
.res{font-size:18px}
#tide{font-size:15px}
#actions button{font-size:16px}
#actions button span{font-size:13px}
#toast{font-size:19px}
.card h2,.card.plain h2{font-size:36px;font-family:var(--sign)}
.card p,.card.plain p{font-size:20px;line-height:1.2}
.card.plain p.small{font-size:16px}
.card.plain .banner.sea{font-size:20px}
.card.plain button{font-size:22px}
.card.plain button.link{font-size:17px}
#chartNote{font-size:20px}
#endTurn{font-size:18px}

#info .pic{flex:none;width:30px;height:30px;display:grid;place-items:center}
#info .sub{font-size:13px;font-weight:700;opacity:.95;display:flex;flex-wrap:wrap;gap:2px 12px}
/* action buttons: a round icon with the name and cost under it (wide screens keep the long rows) */
#actions button .ai{display:none}
#actions button b{font-weight:inherit}
/* the menu: chart, how to play, sound - a round button in the board's top-right corner */
#menuWrap{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;z-index:3}
/* the hint line: what to do next (tutorial) or a one-time tip, one line above the bottom row */
#hint{display:flex;align-items:center;gap:8px;font-size:17px;line-height:1.15;color:var(--cream);text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
#hintTxt{flex:1;min-width:0}
#hintTxt b{font-family:var(--sign);font-weight:700;color:#ffd34d;margin-right:6px}
/* the Letters card: a strip of shore drawn in svg; the unrolled letter */
#overlay .card.shore-card{padding:10px;gap:8px}
.shore-card svg.shore{display:block;width:100%;height:auto}
.shore-card [data-tech]:active{opacity:.7}
.letter-card .letter{display:grid;gap:6px;text-align:center;padding:14px 10px;background:#f6ecd4;border:2px solid #8a6a3a;border-radius:4px;box-shadow:inset 0 10px 0 -4px #e3cf9f,inset 0 -10px 0 -4px #e3cf9f}
/* the tech card: a row per branch, level 1 then level 2 */
.techs-card{gap:10px}
.techs-card .branch h3{margin:0 0 4px;font-family:var(--sign);font-weight:700;font-size:20px;color:var(--inkC)}
.techs-card .techs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:stretch}
.techs-card .then{align-self:center;font-size:22px;color:#8a6a3a}
#overlay .card.techs-card button.tech.tech{display:grid;gap:2px;align-content:start;text-align:left;padding:8px 10px;border-radius:10px 4px 10px 4px;background:#f6ecd4;color:var(--inkC);border:2px solid #6b4a2b;box-shadow:2px 2px 0 #6b4a2b;transform:none;font-family:var(--font);font-size:15px;line-height:1.15}
#overlay .card.techs-card button.tech b{font-family:var(--sign);font-weight:700;font-size:17px}
#overlay .card.techs-card button.tech i{font-style:normal;font-size:14px;color:#5e3f1f}
#overlay .card.techs-card button.tech span{font-size:14px}
#overlay .card.techs-card button.tech .why{color:#8f2f22}
#overlay .card.techs-card button.tech .known{color:#2f6b3a;font-weight:700}
#overlay .card.techs-card button.tech.tech.is-known{background:#e3efd2;border-color:#4a7a45;box-shadow:2px 2px 0 #4a7a45}
#overlay .card.techs-card button.tech.tech.is-locked{opacity:.75;background:#ece1c6}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(255,211,77,.55),0 3px 10px rgba(0,0,0,.55)}}
#endTurn.ready{animation:ready 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){#endTurn.ready{animation:none;box-shadow:0 0 0 4px rgba(255,211,77,.7)}}
#hintX{flex:none;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(12,22,28,.6);color:var(--cream);box-shadow:0 0 0 1.5px rgba(243,230,200,.35);font-size:18px;line-height:1}
/* tip and tutorial cards: the navy ribbon, sketched headings */
.card.plain{font-family:var(--font);color:var(--ink);transform:none}
.card.plain h2{font-family:var(--sign);font-weight:400;font-size:30px;color:#3b2812}
.card.plain p,.card.plain p.small{font-family:var(--font);font-size:17px;line-height:1.35;color:var(--ink);text-align:center}
.card.plain p.small{font-size:14px;opacity:.7}
.card.plain .banner.sea{justify-self:center;margin:-8px 0 2px;padding:8px 34px 10px;color:var(--cream);font-family:var(--sign);font-weight:400;font-size:19px;letter-spacing:.02em;
  background:linear-gradient(#2f5f78,#1f4357);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);filter:drop-shadow(0 3px 0 #13303f)}
.card.plain button{font-family:var(--sign);font-weight:400;font-size:20px;padding:10px 30px}
.card.plain button.link{font-family:var(--font);font-weight:700;font-size:15px;padding:4px 8px 8px}
#menuBtn{width:38px;height:38px;background:rgba(12,22,28,.72);color:var(--cream);box-shadow:0 0 0 1.5px rgba(243,230,200,.4)}
#endTurn svg{display:none}
#endTurn span{display:inline}
#menu{position:absolute;right:0;top:46px;z-index:4;display:grid;gap:2px;padding:6px;min-width:200px;border-radius:12px;background:rgba(18,30,36,.97);box-shadow:0 8px 22px rgba(0,0,0,.5)}
#menu button{display:flex;align-items:center;gap:10px;background:none;box-shadow:none;color:var(--cream);font-weight:700;font-size:16px;padding:10px 12px;text-align:left}
#menu button:active{background:rgba(255,255,255,.08)}
@media (min-width:760px) and (min-aspect-ratio:1/1){
  #panel{display:flex!important;flex-direction:column;gap:8px}
  #sideNote{flex:0 1 auto}
  /* buttons keep their size in a short window; the island note shrinks and scrolls instead (tester 11-01: it hid Rest) */
  #info,.bottom{flex:none}
  /* End turn always shows: the island note gives way first, then the buttons scroll (tester 11-01: the capital's
     long list pushed End turn off and a tap there opened Letters) */
  #actions{flex:0 1 auto;min-height:0;overflow-y:auto}
  #sideNote{flex:0 1000 auto;min-height:0}
  /* the hint line keeps its place when empty, so the buttons under it never jump (tester: 3 wrong recruits) */
  #hint{min-height:62px;align-items:flex-start}
  #hint[hidden]{display:flex!important;visibility:hidden}
  /* the sea and storm text wraps instead of running off the edge */
  #hud .row{flex-wrap:wrap;row-gap:2px}
  #tide{white-space:normal;flex-wrap:wrap;justify-content:flex-end;text-align:right}
  .bottom{margin-top:auto}
}

/* ---- phones: the board fills the screen; the top line and the tray float over it ---- */

  #tide{font-size:13px}
  .res{font-size:15px}
  #panel{height:auto;align-content:end;gap:8px;padding-top:26px;box-shadow:none;background:linear-gradient(rgba(12,22,28,0),rgba(12,22,28,.85) 24px,rgba(12,22,28,.94))}
  #panel>*{pointer-events:auto}
  #info{height:auto;min-height:22px}
  #info .name{font-size:18px}
  #actions{display:flex!important;gap:4px;justify-content:safe center;overflow-x:auto;min-height:0;scrollbar-width:none}
  #actions:empty{display:none!important}
  #actions button{flex:0 0 64px;height:auto;padding:0;background:none;box-shadow:none;color:var(--cream);display:grid;justify-items:center;align-content:start;gap:2px;font-size:12px;font-weight:800;white-space:normal;overflow:visible}
  #actions button .ai{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--cream);color:var(--ink);box-shadow:inset 0 -3px 0 #c4ab7c,0 2px 6px rgba(0,0,0,.45)}
  #actions button span{font-size:11px;opacity:.85;white-space:normal;line-height:1.1;text-align:center}
  #actions button .why{color:#ff9c8a}
  #actions button:disabled{opacity:1}
  #actions button:disabled .ai{opacity:.45}
  #toast{top:calc(var(--hudH,60px) + 6px)}
  /* bare: no tray at all, text and buttons sit on the sea with a shadow */
  /* one row: the picked piece on the left, its buttons in the middle, End turn on the right */
  #panel{background:none;padding-top:8px;gap:8px;display:grid!important;grid-template-columns:minmax(64px,104px) minmax(0,1fr) auto;grid-template-areas:"hint hint hint" "info acts end";align-items:end;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
  #info .who{flex-direction:column;align-items:center;gap:1px;text-align:center;white-space:normal}
  #info .name{font-size:18px}
  #info .hint{font-size:11px}
  #info .sub{justify-content:center;text-align:center;font-size:11px;gap:0 6px;line-height:1.15}
  #info .sub svg{display:none}
  #info .sub .chip{font-size:14px}
  #info .sub .chip:not(:first-child){display:none}
  #actions{gap:6px}
  #actions button{flex-basis:56px}
  #actions button .ai{width:44px;height:44px}
  #endTurn{margin-bottom:16px}
  #hint{grid-area:hint}
  #panel.many{grid-template-areas:"hint hint hint" "acts acts acts" "info info end"}
  #actions{grid-area:acts}
  #info{grid-area:info}
  .bottom{display:contents}
  #status{display:none}
  #endTurn{grid-area:end;width:58px;height:58px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--seal);box-shadow:inset 0 -3px 0 #c4ab7c,0 3px 10px rgba(0,0,0,.55);position:relative;margin-bottom:14px}
  #endTurn svg{display:block}
  #endTurn span{position:absolute;top:61px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:14px;color:var(--cream);white-space:nowrap}
  #endTurn:disabled{opacity:.45}
  #menuWrap{top:calc(var(--hudH,60px) + 6px)}
  .zoom{bottom:calc(var(--panelH,150px) + 10px)}
  .zoom button{width:36px;height:36px;font-size:20px}
}

// costs on buttons as numbers with small icons: "3 food, 1 stone" -> 3[wheat] 1[rock]

const dot = owner => '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="' + COL[owner] + '" stroke="#2b1d10"/></svg>';
const chip = (icon, text) => '<span class="chip">' + icon + text + "</span>";
const line = (name, chips, sub) => '<div class="who">' + name + (chips || "") + "</div>" + (sub ? '<div class="sub">' + sub + "</div>" : "");

function panel() {
  // the first time a letter can be opened, say so once with what the cheapest useful one gives (tester 11-01:
  // ignored letters for 7 games; nothing said "open one now" or what it was worth)
  if (st && st.cur === 0 && !busy && !st.over && letterReady()) {
    const first = Object.keys(E.TECHS).find(id => !E.learnBlock(st, 0, id) && letterNumbers(id));
    if (first) tip("firstLetter", "Open a letter", "Tap the glowing bottle. " + E.TECHS[first].name + ": " + letterNumbers(first) + ", for the rest of the match.");
  }
  // food piling up with nothing to spend it on (tester 11-02: finished with 97 food unspent), once
  if (st && st.cur === 0 && !busy && !st.over && !st.cfg.solo && st.turn >= 4 && st.players[0].food >= 25) tip("spendFood", "Spend your food", "Food does nothing in the store. Train pieces, found villages" + (E.allowed(st, "tech") ? ", open letters" : "") + (E.allowed(st, "trade") ? " or trade it for stone" : "") + ".");
  const info = $("info"), acts = $("actions");
  let html = "", buttons = [], sellBtn = null;
  tags = [];
  // your pieces that can neither move nor attack this turn say so on the board (tester: "nothing tells you a piece
  // can't move until you tap it"); Sell frees the tile
  if (st.cur === 0 && !busy && !st.over) for (const u of st.units) if (u.owner === 0 && !u.moved && !u.acted && !E.moveTargets(st, u).length && !E.attackTargets(st, u).length) tag(u.i, "stuck", "bad");
  // you and the rival both on the peak: tag their pieces on gold, so "Rival on gold too" can be found (tester 11-03:
  // the peak is wide; the rival piece was out of view)
  if (st.cur === 0 && !busy && !st.over && st.peak && st.peak.length && st.units.some(u => u.owner === 0 && st.peak.includes(u.i) && !st.water[u.i]))
    for (const u of st.units) if (u.owner === 1 && st.peak.includes(u.i) && !st.water[u.i]) tag(u.i, "on gold", "bad");
  const su = sel && sel.unit ? E.unitById(st, sel.unit) : null;
  if (st.over) html = line('<span class="name">Match over</span>', "", "");
  else if (st.cur !== 0 || busy) html = line('<span class="name">The rival moves</span>', "", "");
  else if (su) {
    const title = piecePic(su.type, su.owner) + '<span class="name">' + (su.rank ? E.RANK_NAMES[su.rank] + " " : "") + NAMES[su.type] + "</span>";
    let sub = "";
    if (su.owner === 0) {
      const aimTown = aim !== null ? E.townAt(st, aim) : null;
      if (aim !== null && aimTown && aimTown.owner === 0 && !E.unitAt(st, aim) && E.moveTargets(st, su).includes(aim)) {
        sub = '<span class="hint">Into your ' + (aimTown.capital ? "capital" : "village") + "? It can't train while a piece stands on it.</span>";
        const to = aim;
        buttons.push(["Move in", "tap again", () => act({ kind: "move", unit: su.id, to }), ""]);
      } else if (aim !== null && E.unitAt(st, aim) && E.unitAt(st, aim).owner === 1 && E.attackTargets(st, su).includes(E.unitAt(st, aim))) {
        const f = E.fight(st, su, E.unitAt(st, aim));
        const takes = f.kills && su.type === "spear" && E.townAt(st, aim) && E.townAt(st, aim).owner === 1;
        tag(aim, "Hit " + f.dmg + (f.kills ? (takes ? " · kill · take village" : " · kill") : "") + (f.ret ? " · back " + f.ret + (f.dies ? ", you die" : "") : ""), f.dies ? "bad" : "go");
        buttons.push(["Attack", "", () => act({ kind: "attack", unit: su.id, target: E.unitAt(st, aim).id })]);
      } else if (aim !== null && su.type === "sapper" && E.sapTargets(st, su).includes(aim)) {
        tag(aim, "Wall -1 · " + short(sapPreview(aim)), "go");
        buttons.push(["Break wall", "", () => act({ kind: "sap", unit: su.id, at: aim })]);
      } else if (su.type === "builder") {
        buttons.push(["Wall +1", E.wallCost(st, 0) + " stone", () => act({ kind: "wall", unit: su.id }), E.wallBlock(st, su)]);
        // founding on land the sea takes soon: say so once (tester: villages founded on turns 1-7 drowned at the turn
        // 15 and 19 rises; the rival builds high)
        // the same flood model as the dry-site flags (engine floodSet: a low tile ringed by high land stays dry)
        const floodsOn = E.floodsOnTurn(st, su.i), soon = floodsOn > 0;
        // any village the sea will take before the end, not only soon (tester 11-02: villages founded on turns 1-7 drowned
        // on turn 15 with no warning; the rival wins by building high and walling early)
        if (!soon && E.drySites(st, 0, su.i).length) tip("flags", "Flags", "Flags mark the best village spots near this builder. The sea never reaches them.");
        if (soon && !E.foundBlock(st, su)) tip("lowVillage", "Low ground", "A village here drowns at the end of turn " + floodsOn + ". Found on high ground, or wall it as high as the sea goes (" + E.finalSea(st) + ").");
        buttons.push(["Village", E.foundCost(st, 0, su.i) + " food" + (floodsOn ? ", floods turn " + floodsOn : ", uses builder"), () => act({ kind: "found", unit: su.id }), E.foundBlock(st, su)]);
        for (const type of E.buildsFor(st, su)) {
          const k = E.BUILD[type], c = E.buildCost(st, 0, type);
          buttons.push([type === "tower" ? "Tower" : k.name, [c.food && c.food + " food", c.stone && c.stone + " stone"].filter(Boolean).join(", "), () => act({ kind: "build", unit: su.id, type }), E.buildBlock(st, su, type)]);
        }
      }
      // what this kind of piece does, once (tester 11-01: never told what a Shield does)
      if (su.type !== "builder" && su.type !== "spear" && WHAT[su.type]) tip("piece_" + su.type, NAMES[su.type], WHAT[su.type]);
      // docks (MO 11-02: "I build docks, how does it work, not clear"): say how to sail, once each
      const onDock = st.bld[su.i] && st.bld[su.i].type === "dock";
      if (onDock && !su.moved && E.sailTargets(st, su).length) tip("sail", "Sailing", "Blue rings: this piece can sail to any shore up to " + E.SAIL + " tiles away. Tap one to sail there.");
      else if (!onDock && st.bld.some(b => b && b.type === "dock" && b.owner === 0)) tip("dock", "Docks", "Move a piece onto your dock. Next turn pick it again: blue rings show every shore it can sail to, up to " + E.SAIL + " tiles away.");
      // a piece on your own village blocks training there (tester 11-01: the train buttons were never found)
      const homeT = E.townAt(st, su.i);
      if (homeT && homeT.owner === 0 && E.trainable(st, 0).length) tip("trainEmpty", "Training", "A village trains pieces only when it is empty. Move this piece off, then tap the village.");
      // under the clouds: any piece can brace its tile against the storm on its way
      if (aim === null && st.storm && E.inStorm(st, su.i) && !st.water[su.i]) {
        tip("brace", "Brace", "Any piece under a cloud can Brace its tile for " + E.braceCost(st, 0) + " stone: it stays dry when this storm hits, however many turns away; the water runs past it. Each further Brace in one storm costs more.");
        buttons.push(["Brace", E.braceCost(st, 0) + " stone", () => act({ kind: "brace", unit: su.id }), E.braceBlock(st, su)]);
      }
      if (su.type === "spear" && !E.isDone(su) && aim === null) {
        // rival villages next to it: walk in if empty, or kill the defender to take it
        const near = st.b.nbrs(su.i).map(n => E.townAt(st, n)).filter(t => t && t.owner === 1);
        if (near.length) tip("take", "Taking villages", "Walk into an empty rival village, or kill its defender: your spear walks in and takes it.");
        const home = E.townAt(st, su.i);
        if (home && home.owner === 0 && E.allowed(st, "drill") && su.rank < 2) tip("drill", "Drill", "A spear in your village can Drill up a rank for food and stone, no kills needed.");
        for (const t of near) tag(t.i, E.unitAt(st, t.i) ? "Kill the defender: take it" : "Walk in: take it", "go");
      }
      if (su.type === "spear" && E.allowed(st, "drill") && su.rank < 2 && aim === null && E.townAt(st, su.i) && E.townAt(st, su.i).owner === 0) {
        const k = E.drillCost(st, 0, su.rank + 1);
        buttons.push(["Drill", k.food + " food, " + k.stone + " stone", () => act({ kind: "drill", unit: su.id }), E.drillBlock(st, su)]);
      }
      // sell any piece for half its price (asks twice); last in the row
      if (aim === null) {
        const back = E.sellValue(st, su), armed = disbandArm === su.id;
        sellBtn = ["Sell", armed ? "tap again" : "+" + back.food + " food" + (back.stone ? ", +" + back.stone + " stone" : ""), () => { if (disbandArm === su.id) { disbandArm = null; act({ kind: "disband", unit: su.id }); } else { disbandArm = su.id; render(); } }, ""];
      }
      if (!su.moved && !su.acted && aim === null) {
        const heal = E.restHeal(st, su);
        if (heal > 0) tip("rest", "Rest", "Pay " + E.restCost(st, 0) + " food: the piece heals " + E.REST_HEAL + " next turn, or " + E.HOME_HEAL + " in your village.");
        buttons.push(["Rest", E.restCost(st, 0) + " food, +" + heal + " health", () => act({ kind: "rest", unit: su.id }), E.restBlock(st, su)]);
      }
    }
    // phones show only the first fact under the name: health if hurt, else when its tile floods
    html = line(title, su.owner === 0 && E.isDone(su) ? '<span class="hint">done this turn</span>' : "", (su.hp < E.maxHp(su, st) ? chip(IC.heart, su.hp + " of " + E.maxHp(su, st) + " health") : "") + floodChip(su.i) + (E.atkOf(su, st) ? chip(IC.sword, "hits " + Math.max(1, Math.round(2 * E.hitOf(su, st))) + (su.hp < E.maxHp(su, st) ? " (hurt)" : "")) : "") +
      (su.type === "spear" ? chip(IC.star, su.rank < 2 ? su.kills + " of " + E.RANK_KILLS[su.rank] + " kills to " + E.RANK_NAMES[su.rank + 1] : (su.kills ? su.kills + " kills" : "drilled")) : ""));
  } else if (sel && sel.town !== undefined) {
    const t = E.townAt(st, sel.town);
    html = line(piecePic("village", 0) + '<span class="name">' + (t.capital ? "Your capital" : t.grown ? "Your town" : "Your village") + "</span>", "", floodChip(t.i));
    for (const type of E.trainable(st, 0)) {
      const k = E.unitCost(st, 0, type);
      buttons.push([NAMES[type], k.food + " food" + (k.stone ? ", " + k.stone + " stone" : ""), () => act({ kind: "train", town: t.i, type }), E.trainBlock(st, t, type)]);
    }
    if (E.allowed(st, "town", 0) && !t.capital && !t.grown) buttons.push(["Town", E.growCost(st, 0).food + " food, " + E.growCost(st, 0).stone + " stone", () => act({ kind: "grow", town: t.i }), E.growBlock(st, t)]);
    if (E.allowed(st, "trade")) tip("trade", "Trade", "Short of stone? Once a turn, any village swaps " + E.tradeRate(st, 0) + " food for 1 stone, or " + E.tradeRate(st, 0) + " stone for 1 food.");
    if (E.allowed(st, "town", 0) && !t.capital && !t.grown) tip("town", "Towns", "Grow a village into a town: its border reaches 2 tiles, like your capital's.");
    // one Trade button: its card offers both swaps (keeps the row short on a phone)
    if (E.allowed(st, "trade")) {
      const why = E.tradeBlock(st, t, "food") && E.tradeBlock(st, t, "stone") ? (st.traded && st.traded[t.i] ? "Traded this turn" : "Needs " + E.tradeRate(st, 0)) : "";
      buttons.push(["Trade", E.tradeRate(st, 0) + " for 1", () => tradeCard(t), why]);
    }
    if (E.allowed(st, "tech") && t.capital) {
      tip("tech", "Letters", "Bottles wash up at your capital. Open one letter a turn: Sea, War or Land. Each opened makes the next dearer, so pick a direction.");
      const open = Object.keys(E.TECHS).filter(id => !E.learnBlock(st, 0, id)).length;
      buttons.push(["Letters", st.learned ? "opened this turn" : open ? open + " to open" : ((st.techs || [[], []])[0] || []).length + " opened", techCard, ""]);
    }
  } else if (sel && sel.tile !== undefined) {
    const i = sel.tile, t = E.townAt(st, i);
    if (st.water[i]) html = line('<span class="name">' + (st.h[i] >= 1 ? "Drowned land" : "Open sea") + "</span>", "", "");
    else if (!t && st.bld[i]) {
      const b = st.bld[i], k = E.BUILD[b.type], mine = b.owner === 0, pays = E.territory(st)[i] === b.owner;
      if (b.owner === -1) {
        html = line('<span class="name">Old ' + k.name.toLowerCase() + "</span>", '<span class="hint">walk a piece onto it to take it</span>', floodChip(i));
      } else {
      const what = b.type === "tower" ? "Claims the land around it." : pays ? "+" + (k.gives.food || k.gives.stone) + " " + (k.gives.food ? "food" : "stone") + " a turn for " + (mine ? "you" : "them") + "." : "Outside " + (mine ? "your" : "their") + " border: earns nothing.";
      html = line(dot(b.owner) + '<span class="name">' + (mine ? "Your " : "Rival ") + k.name.toLowerCase() + "</span>", '<span class="hint">' + short(what) + "</span>" + floodChip(i), "");
      }

    }
    else html = line((t ? dot(t.owner) : "") + '<span class="name">' + (t ? (t.owner === 0 ? (t.capital ? "Your capital" : "Your village") : (t.capital ? "Rival capital" : "Rival village")) : st.h[i] >= 3 ? "Rocky ground" : "Farmland") + "</span>", floodChip(i) + (!t && E.BUILD.farm.on(st.h[i]) && E.allowed(st, "farm") ? '<span class="hint">farm here: +2 food</span>' : !t && E.BUILD.quarry.on(st.h[i]) && E.allowed(st, "quarry") ? '<span class="hint">quarry here: +2 stone</span>' : ""), "");
  // nothing picked: say what to do, unless the hint line above already does
  } else html = coach !== null || tipNow || situation() ? "" : line('<span class="name">Your move</span>', '<span class="hint">Tap a piece or village</span>', "");
  if (sellBtn && !st.cfg.solo) buttons.push(sellBtn);
  // an action this island does not have is not a button at all
  buttons = buttons.filter(x => x[3] !== "Not on this island");
  info.innerHTML = html;
  // more than 3 buttons: they get the full width above the name (phones)
  $("panel").classList.toggle("many", buttons.length > 3);
  acts.innerHTML = "";
  acts.style.gridTemplateColumns = "repeat(" + Math.max(3, buttons.length) + ",minmax(0,1fr))";
  for (const [label, cost, fn, blocked] of buttons) {

  svg += '<text x="150" y="78" text-anchor="middle" font-family="Cabin Sketch, cursive" font-weight="700" font-size="24" fill="#3a2414">Letters from the sea</text>';
  svg += '<text x="150" y="98" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="14" fill="#5e3f1f">Open one a turn. Each opened makes the next dearer.</text>';
  branches.forEach((br, r) => {
    const y = 160 + r * 125, ids = Object.keys(E.TECHS).filter(id => E.TECHS[id].branch === br && E.techHere(st, id)).sort((p, q) => E.TECHS[p].tier - E.TECHS[q].tier);
    svg += '<text x="18" y="' + (y - 25) + '" font-family="Cabin Sketch, cursive" font-weight="700" font-size="17" fill="' + (BRANCH_INK[br] || "#3a2414") + '">' + E.BRANCHES[br].name + "</text>";
    ids.forEach((id, c) => { const ls = letterState(id); svg += '<g data-tech="' + id + '" style="cursor:pointer">' + bottleSvg(85 + c * 130, y, br, ls.state, E.TECHS[id].name, ls.tag) + "</g>"; });
  });
  svg += "</svg>";
  const rival = ((st.techs || [[], []])[1] || []).map(id => E.TECHS[id].name);
  showCard(svg + '<p class="small">' + (rival.length ? "The rival has opened: " + rival.join(", ") + "." : "The rival has opened no letters yet.") + "</p>", "Close", () => {});
  $("card").classList.add("plain", "shore-card");
  $("card").querySelectorAll("[data-tech]").forEach(el => el.addEventListener("click", () => letterCard(el.dataset.tech)));
}
// one letter, unrolled: what it teaches, what it costs, and the seal that opens it
// what a letter changes, in numbers for this match ("Walls: 3 -> 2 stone"); "" when it opens something new
function letterNumbers(id, p = 0) {
  const NUM = {
    "cost.wall": ["Walls", () => E.wallCost(st, p), " stone"],
    "spear.atk": ["Spear attack", () => E.stat(st, p, "spear.atk", E.UNIT.spear.atk), ""],
    "income.capital.food": ["Capital food", () => E.stat(st, p, "income.capital.food", E.CAPITAL_GIVES.food), " a turn"],
  };
  return (E.TECHS[id].fx || []).filter(f => NUM[f.key] && f.add).map(f => { const [n, now, unit] = NUM[f.key], a = now(); return n + ": " + a + " → " + (a + f.add) + unit; }).join(", ");
}
function letterCard(id) {
  const k = E.TECHS[id], ls = letterState(id), c = E.techCost(st, 0, id);
  const glass = { sea: "sea-green", war: "amber", land: "green" }[k.branch] || "glass";
  const body = '<div class="letter"><p class="small">A letter in ' + (/^[aeiou]/.test(glass) ? "an " : "a ") + glass + ' bottle</p><h2>' + k.name + '</h2><p class="old">' + k.text + "</p>" + (letterNumbers(id) && ls.state !== "known" ? '<p class="small">' + letterNumbers(id) + "</p>" : "") +
    '<p class="small">' + (ls.state === "known" ? "Opened" : "Costs " + c.food + " food and " + c.stone + " stone") + "</p>" +
    (ls.state === "known" ? "" : ls.state === "ready" ? "" : '<span class="inkBtn off">Open</span><p class="why">' + ls.tag.replace(/^Not yet: /, "Not yet: ") + "</p>") + "</div>";
  const btns = ls.state === "ready" ? [["Open", () => act({ kind: "learn", tech: id })], ["Back to the shore", techCard, "link"]] : [["Back to the shore", techCard, "link"]];
  showCard(body, btns);
  $("card").classList.add("plain", "letter-card");
}
